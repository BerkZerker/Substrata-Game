[package]
name = "substrata"
version = "0.1.0"
edition = "2021"
description = "Substrata - 2D destructible voxel terrain game with a custom native Rust/wgpu engine"

[lib]
name = "substrata"
path = "src/lib.rs"

[[bin]]
name = "substrata"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "24.0"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.29"
fastnoise-lite = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
